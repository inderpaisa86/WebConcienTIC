name: ConcienTIC catalog daily run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  trigger-catalog-run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger protected catalog endpoint
        env:
          CATALOG_URL: ${{ secrets.CATALOG_URL }}
          INGESTION_TOKEN: ${{ secrets.INGESTION_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CATALOG_URL"
          test -n "$INGESTION_TOKEN"
          curl --fail-with-body --retry 3 --retry-delay 10 --connect-timeout 30 --max-time 180 \
            -X POST "$CATALOG_URL/internal/runs/daily" \
            -H "Authorization: Bearer $INGESTION_TOKEN" \
            -H "Idempotency-Key: catalog-${{ github.run_id }}"
