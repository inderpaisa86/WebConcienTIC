spring:
  application:
    name: concientic-catalog
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/concientic}
    username: ${DATABASE_USERNAME:concientic}
    password: ${DATABASE_PASSWORD:concientic}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

concientic:
  ingestion:
    token: ${INGESTION_TOKEN:}
    openlearn:
      urls: ${OPENLEARN_SEED_URLS:https://www.open.edu/openlearn/digital-computing/digital-skills-succeeding-digital-world,https://www.open.edu/openlearn/digital-computing/introduction-cyber-security-stay-safe-online}
  review:
    token: ${REVIEW_TOKEN:${INGESTION_TOKEN:}}
  timezone: ${TIMEZONE:America/Bogota}
  verification:
    timeout-seconds: ${VERIFICATION_TIMEOUT_SECONDS:15}
    max-body-bytes: ${VERIFICATION_MAX_BODY_BYTES:1000000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://concientic.com,http://localhost:3000}
