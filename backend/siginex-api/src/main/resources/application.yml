spring:
  application:
    name: siginex-api
  datasource:
    # In production DATABASE_URL is the Neon (PostgreSQL) POOLER JDBC connection
    # string, e.g.
    #   jdbc:postgresql://<project>-pooler.<region>.aws.neon.tech/<db>?sslmode=require
    # All credentials come from environment variables, never from the repo. The
    # defaults below point at a local Postgres and are non-sensitive dev values.
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/siginex}
    username: ${DATABASE_USERNAME:siginex}
    password: ${DATABASE_PASSWORD:siginex}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:5}
      # Neon's pooler can be cold on the first connection; give it room and do
      # not fail fast at startup (initialization-fail-timeout: -1).
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      initialization-fail-timeout: ${DATABASE_INIT_FAIL_TIMEOUT_MS:-1}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

siginex:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://concientic.com,http://localhost:3000}
